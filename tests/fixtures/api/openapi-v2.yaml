openapi: 3.1.0
info:
  title: Inventory
  description: A small inventory API that openapi-orb's tests check.
  version: 2.0.0
  contact:
    name: openapi-orb
    url: https://github.com/juburr/openapi-orb
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8080
tags:
  - name: items
    description: Items in stock.
paths:
  /items:
    get:
      operationId: listItems
      summary: List the items
      description: Lists every item in stock.
      tags: [items]
      responses:
        "200":
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      summary: Add an item
      description: Adds an item to the inventory.
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewItem"
      responses:
        "201":
          description: The item added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: The request was not a valid item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /health:
    get:
      operationId: health
      summary: Check health
      description: Says whether the API is up.
      tags: [items]
      responses:
        "204":
          description: The API is up.
  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The item's identifier.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getItem
      summary: Get an item
      description: Gets one item by its identifier.
      tags: [items]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          description: The identifier is not a positive integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: There is no such item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    NewItem:
      type: object
      additionalProperties: false
      required: [name, price, sku]
      properties:
        sku:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: number
          minimum: 0
    Item:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        price:
          type: number
          minimum: 0
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
