description: >
  Installs the OpenAPI tools named in tools, through the install command for
  each (install_vacuum, install_oasdiff, install_schemathesis), which can
  also be used on their own. vacuum and oasdiff are release binaries verified
  against this orb's checksum tables. Schemathesis is installed with uv,
  itself verified against a checksum table, into an environment of its own
  on a CPython uv checks against the SHA-256 it carries, from this orb's lock
  for the release, which pins every file to its SHA-256. Run this before the
  orb's other commands.
parameters:
  tools:
    type: string
    default: "vacuum,oasdiff"
    description: >
      The tools to install, separated by commas or spaces: any of vacuum (for
      lint and bundle), oasdiff (for breaking and drift), schemathesis (for
      contract_test, with uv and a Python) and uv. An unknown name fails the
      step.
  vacuum_version:
    type: string
    default: "0.35.1"
    description: The vacuum release, when tools names it. Environment variables are expanded.
  oasdiff_version:
    type: string
    default: "1.34.1"
    description: The oasdiff release, when tools names it. Environment variables are expanded.
  schemathesis_version:
    type: string
    default: "4.32.4"
    description: The Schemathesis release, when tools names it. Environment variables are expanded.
  uv_version:
    type: string
    default: "0.13.6"
    description: The uv release, when tools names schemathesis or uv. Environment variables are expanded.
  python:
    type: string
    default: "3.14"
    description: >
      The Python Schemathesis runs on: 3.11 to 3.14 for a CPython that uv
      downloads and checks against the SHA-256 it carries for that build,
      "system" for the python3 on the PATH, or an interpreter's absolute path.
      Environment variables are expanded.
  index_url:
    type: string
    default: "https://pypi.org/simple"
    description: >
      The package index to download Schemathesis from, such as a PyPI mirror:
      an https:// URL, without credentials or a query or fragment. The lock's
      hashes decide what is installed. Environment variables are expanded.
  python_install_mirror:
    type: string
    default: ""
    description: >
      Base URL of a mirror of uv's Python downloads, https:// or file://. uv
      still checks every download against the SHA-256 it carries. Environment
      variables are expanded.
  download_base_url:
    type: string
    default: ""
    description: >
      Base URL of an internal mirror of GitHub releases to download vacuum,
      oasdiff and uv from instead of https://github.com, such as an
      Artifactory or Nexus remote repository: an https:// URL, without
      credentials or a query or fragment. Environment variables are expanded.
  caching:
    type: boolean
    default: true
    description: >
      Cache the verified releases and the Python archive uv downloads between
      jobs. Each is checked again whenever it is used. Installed environments
      and packages are never cached.
  install_path:
    type: string
    default: ""
    description: >
      Absolute path of the directory to install the tools into. It is added
      to the PATH of later steps when it isn't already on it. Environment
      variables are expanded. Defaults to $HOME/.openapi-orb/bin.
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      Verification of vacuum, oasdiff and uv against this orb's checksum
      tables, and of Schemathesis against this orb's lock for its release.
      "strict" (default) fails before downloading anything when a version has
      no checksum or lock. "known_versions" installs unlisted versions
      unverified, with a warning. "false" skips verification and is not
      recommended.
steps:
  - run:
      name: Check the tools to install
      environment:
        PARAM_TOOLS: << parameters.tools >>
      command: << include(scripts/install_tools.sh) >>
  - when:
      condition:
        matches:
          pattern: "^(.*[ ,])?vacuum([ ,].*)?$"
          value: << parameters.tools >>
      steps:
        - install_vacuum:
            caching: << parameters.caching >>
            download_base_url: << parameters.download_base_url >>
            install_path: << parameters.install_path >>
            verify_checksums: << parameters.verify_checksums >>
            version: << parameters.vacuum_version >>
  - when:
      condition:
        matches:
          pattern: "^(.*[ ,])?oasdiff([ ,].*)?$"
          value: << parameters.tools >>
      steps:
        - install_oasdiff:
            caching: << parameters.caching >>
            download_base_url: << parameters.download_base_url >>
            install_path: << parameters.install_path >>
            verify_checksums: << parameters.verify_checksums >>
            version: << parameters.oasdiff_version >>
  # install_schemathesis installs uv first, so uv on its own is installed
  # only when schemathesis isn't.
  - when:
      condition:
        and:
          - matches:
              pattern: "^(.*[ ,])?uv([ ,].*)?$"
              value: << parameters.tools >>
          - not:
              matches:
                pattern: "^(.*[ ,])?schemathesis([ ,].*)?$"
                value: << parameters.tools >>
      steps:
        - install_uv:
            caching: << parameters.caching >>
            download_base_url: << parameters.download_base_url >>
            install_path: << parameters.install_path >>
            verify_checksums: << parameters.verify_checksums >>
            version: << parameters.uv_version >>
  - when:
      condition:
        matches:
          pattern: "^(.*[ ,])?schemathesis([ ,].*)?$"
          value: << parameters.tools >>
      steps:
        - install_schemathesis:
            caching: << parameters.caching >>
            download_base_url: << parameters.download_base_url >>
            index_url: << parameters.index_url >>
            install_path: << parameters.install_path >>
            install_uv: true
            python: << parameters.python >>
            python_install_mirror: << parameters.python_install_mirror >>
            uv_version: << parameters.uv_version >>
            verify_checksums: << parameters.verify_checksums >>
            version: << parameters.schemathesis_version >>
