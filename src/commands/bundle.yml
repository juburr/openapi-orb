description: >
  Bundles an OpenAPI document split across files into one with vacuum,
  inlining every $ref to another file (and, with remote references, which
  vacuum follows by default, to a URL), so the document can be published,
  served or given to a tool that reads one file. The bundle must be a
  document whose every remaining $ref points inside it, at something that is
  there; a reference vacuum couldn't resolve fails the step, and output is
  only written then. Run install (tools: vacuum) first.
parameters:
  working_dir:
    type: string
    default: "."
    description: The directory to run in. spec and output are relative to it.
  spec:
    type: string
    description: >
      The document to bundle, such as openapi.yaml, whose $refs are relative
      to it. Environment variables are expanded.
  output:
    type: string
    description: >
      The file to write the bundled document to, such as dist/openapi.yaml.
      Its directory is created if needed; it can't be spec itself.
      Environment variables are expanded.
  format:
    type: enum
    enum: ["auto", "yaml", "json"]
    default: auto
    description: The bundled document's format. auto is JSON for an output ending in .json, else YAML.
  composed:
    type: boolean
    default: false
    description: >
      Move every external component into the document's components section,
      and point the references there, instead of inlining each one where it
      is used.
  extra_args:
    type: string
    default: ""
    description: >
      Further options for vacuum bundle, such as --remote=false or --ext-refs.
      They are split like shell words, but nothing in them is expanded or
      run. Options the command sets itself are refused. Environment variables
      are expanded.
steps:
  - run:
      name: Bundle << parameters.spec >>
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_COMPOSED: << parameters.composed >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_FORMAT: << parameters.format >>
        PARAM_OUTPUT: << parameters.output >>
        PARAM_SPEC: << parameters.spec >>
        SCRIPT_OPENAPI_LIB: << include(scripts/lib/openapi.sh) >>
      command: << include(scripts/bundle.sh) >>
